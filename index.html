function block(x,z,w,d,h,m){

function coinChime(){
  const ctx=listener.context;
  const now=ctx.currentTime;
  [880,1174.66].forEach((freq,j)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,now);
    g.gain.exponentialRampToValueAtTime(.09,now+.01+j*.025);
    g.gain.exponentialRampToValueAtTime(.0001,now+.28+j*.05);
    o.connect(g).connect(ctx.destination);
    o.start(now+j*.04);o.stop(now+.38+j*.05);
  });
}

}

function makeLabel(text,bg="#2b201d",fg="#fff1c7"){
  const canvas=document.createElement("canvas");
  canvas.width=768;canvas.height=240;
  const x=canvas.getContext("2d");

  const wood=x.createLinearGradient(0,0,0,canvas.height);
  wood.addColorStop(0,"#3a2a24");
  wood.addColorStop(.45,bg);
  wood.addColorStop(1,"#1c1515");
  x.fillStyle=wood;
  x.fillRect(8,8,canvas.width-16,canvas.height-16);

  x.globalAlpha=.16;
  x.strokeStyle="#d2a56d";
  x.lineWidth=3;
  for(let i=0;i<7;i++){
    const yy=34+i*28;
    x.beginPath();
    x.moveTo(34,yy);
    x.bezierCurveTo(180,yy-7,360,yy+9,734,yy-3);
    x.stroke();
  }
  x.globalAlpha=1;

  x.strokeStyle="#7d5a2f";x.lineWidth=14;x.strokeRect(12,12,744,216);
  x.strokeStyle="#d6b468";x.lineWidth=5;x.strokeRect(24,24,720,192);
  x.strokeStyle="#5e4325";x.lineWidth=2;x.strokeRect(33,33,702,174);

  for(const px of [31,737])for(const py of [31,209]){
    x.beginPath();x.arc(px,py,7,0,Math.PI*2);
    x.fillStyle="#e0bd70";x.fill();
    x.beginPath();x.arc(px-2,py-2,2.2,0,Math.PI*2);
    x.fillStyle="#fff0b4";x.fill();
  }

  x.fillStyle="#d7b36a";
  x.font="28px Georgia,serif";
  x.textAlign="center";x.textBaseline="middle";
  x.fillText("❦",54,120);
  x.fillText("❦",714,120);

  const words=String(text).trim().split(/\s+/);
  let lines=[words.join(" ")];
  if(text.length>16&&words.length>1){
    let best=1,bestDiff=999;
    for(let i=1;i<words.length;i++){
      const a=words.slice(0,i).join(" "),b=words.slice(i).join(" ");
      const diff=Math.abs(a.length-b.length);
      if(diff<bestDiff){best=i;bestDiff=diff}
    }
    lines=[words.slice(0,best).join(" "),words.slice(best).join(" ")];
  }

  const maxWidth=500;
  let size=lines.length===1?66:51;
  while(size>38){
    x.font=`600 ${size}px Georgia,serif`;
    if(lines.every(line=>x.measureText(line).width<=maxWidth))break;
    size-=2;
  }

  x.textAlign="center";x.textBaseline="middle";
  x.fillStyle=fg;
  x.shadowColor="#000";
  x.shadowBlur=8;
  x.shadowOffsetY=3;
  const y0=lines.length===1?120:88;
  const gap=61;
  lines.forEach((line,i)=>x.fillText(line,384,y0+i*gap));
  x.shadowBlur=0;x.shadowOffsetY=0;

  const tex=new THREE.CanvasTexture(canvas);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.magFilter=THREE.NearestFilter;
  tex.minFilter=THREE.LinearFilter;

  // Real in-world sign geometry instead of a camera-facing sprite.
  const g=new THREE.Group();
  const boardMat=new THREE.MeshStandardMaterial({color:0x281d1b,roughness:.96,metalness:0});
  const board=new THREE.Mesh(new THREE.BoxGeometry(4.85,1.46,.11),boardMat);
  g.add(board);

  const faceMat=new THREE.MeshBasicMaterial({map:tex,depthTest:true,depthWrite:true});
  const front=new THREE.Mesh(new THREE.PlaneGeometry(4.72,1.33),faceMat);
  front.position.z=.061;
  g.add(front);

  const rear=new THREE.Mesh(new THREE.PlaneGeometry(4.72,1.33),faceMat);
  rear.position.z=-.061;
  rear.rotation.y=Math.PI;
  g.add(rear);

  return g;
}

    o.type="triangle";o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,now+i*.055);
    g.gain.exponentialRampToValueAtTime(.055,now+.02+i*.055);
    g.gain.exponentialRampToValueAtTime(.0001,now+.34+i*.055);
    o.connect(g).connect(ctx.destination);o.start(now+i*.055);o.stop(now+.42+i*.055);
  });
}

function updateShopAndDoor(t){
  if(!started||transitioning||gameComplete||inShop)return;

  shopKey.rotation.y=t*1.15;
  shopKey.position.y=2.05+Math.sin(t*2.0)*.08;
  const seasonColor=seasonDoorColors[world]||0xffffff;
  doorInnerMat.color.setHex(seasonColor);
  for(const s of doorStars){
    s.material.opacity=(hasKey ? .45 : .16)+.18*(.5+.5*Math.sin(t*2+s.userData.phase));
  }
  doorInnerMat.opacity=hasKey ? .68+.12*Math.sin(t*2.2) : .24+.035*Math.sin(t*1.4);
  doorGlow.intensity=hasKey ? 2.7+.55*Math.sin(t*2.4) : .42+.12*Math.sin(t*1.2);

  const now=performance.now();
  if(now<interactionLock)return;

  const shopDist=Math.hypot(camera.position.x-keyShop.position.x,camera.position.z-keyShop.position.z);
  if(shopReady&&!hasKey&&shopDist<1.85&&now>shopCooldown){
    interactionLock=now+1600;
    enterShop(keyShopConfigs[world],{
      x:-10.4,z:19.1,yaw:Math.PI
    });
    return;
  }

  const doorDist=Math.hypot(camera.position.x-seasonDoor.position.x,camera.position.z-seasonDoor.position.z);
  if(hasKey&&doorDist<1.35){
    interactionLock=now+2000;
    useSeasonDoor();
  }
}

function updateFestival(dt,t){
  if(!festivalMode)return;

  for(const p of townspeople){
    if(p.pause>0){p.pause-=dt;continue}
    const target=p.dir>0?p.b:p.a;
    let dx=target.x-p.group.position.x,dz=target.z-p.group.position.z;
    const d=Math.hypot(dx,dz);
    if(d<.28){
      p.dir*=-1;
      p.pause=.7+Math.random()*1.5;
      continue;
    }
    dx/=d;dz/=d;
    p.group.position.x+=dx*p.speed*dt;
    p.group.position.z+=dz*p.speed*dt;
    p.group.rotation.y=Math.atan2(dx,dz);
    const swing=Math.sin(t*5.5+p.phase)*.36;
    p.legL.rotation.x=swing;p.legR.rotation.x=-swing;
    p.group.position.y=.02+Math.abs(Math.sin(t*5.5+p.phase))*.018;
  }

  if(t>nextFireworkAt){
    launchFirework();
    nextFireworkAt=t+THREE.MathUtils.randFloat(1.7,3.3);
  }

  for(let i=fireworks.length-1;i>=0;i--){
    const fw=fireworks[i],arr=fw.points.geometry.attributes.position.array;
    fw.life-=dt;
    for(let j=0;j<arr.length/3;j++){
      fw.velocities[j*3+1]-=2.1*dt;
      arr[j*3]+=fw.velocities[j*3]*dt;
      arr[j*3+1]+=fw.velocities[j*3+1]*dt;
      arr[j*3+2]+=fw.velocities[j*3+2]*dt;
    }
    fw.points.geometry.attributes.position.needsUpdate=true;
    fw.points.material.opacity=Math.max(0,fw.life/fw.ttl);
    if(fw.life<=0){
      scene.remove(fw.points);
      fw.points.geometry.dispose();fw.points.material.dispose();
      fireworks.splice(i,1);
    }
  }
}

    let tx,tz,chasing=false;

    if(pd<e.chase){

    }else{
      const target=e.dir>0?e.b:e.a;
      tx=target.x;tz=target.z;
      if(Math.hypot(tx-ex,tz-ez)<.45){

    let dx=tx-ex,dz=tz-ez;

      e.group.position.z=nz;
    }else if(chasing){
      const target=e.dir>0?e.b:e.a;
      let px=target.x-ex,pz=target.z-ez;

    }

    e.group.position.y=.04+Math.sin(t*2.1+e.phase)*.045;

    if(Math.hypot(camera.position.x-e.group.position.x,camera.position.z-e.group.position.z)<.78)enemyHit();
  }
}

function makePrototypeMusic(){
  const ctx=listener.context,sr=ctx.sampleRate,step=.29;
  const chords=[
    [293.66,349.23,440.00,587.33],
    [233.08,293.66,349.23,466.16],
    [261.63,329.63,392.00,523.25],
    [220.00,277.18,329.63,440.00]
  ];
  const pattern=[0,1,2,3,2,1,2,3];
  const total=chords.length*pattern.length*step;
  const buf=ctx.createBuffer(1,Math.floor(total*sr),sr);
  const data=buf.getChannelData(0);

  function addTone(freq,start,dur,amp){
    const a=Math.floor(start*sr),b=Math.min(data.length,Math.floor((start+dur)*sr));
    for(let i=a;i<b;i++){
      const t=(i-a)/sr;
      const attack=Math.min(1,t/.018);
      const decay=Math.exp(-3.1*t/dur);
      const env=attack*decay;
      const ph=2*Math.PI*freq*t;
      data[i]+=amp*env*(Math.sin(ph)+.22*Math.sin(ph*2)+.08*Math.sin(ph*3));
    }
  }

  let n=0;
  for(let c=0;c<chords.length;c++){
    const chord=chords[c];
    for(let s=0;s<pattern.length;s++,n++){
      const start=n*step;
      addTone(chord[pattern[s]],start,step*.92,.17);
      if(s===0||s===4) addTone(chord[0]/2,start,step*1.8,.11);
    }
  }

  let peak=.001;
  for(let i=0;i<data.length;i++) peak=Math.max(peak,Math.abs(data[i]));
  const gain=.72/peak;
  for(let i=0;i<data.length;i++) data[i]*=gain;
  return buf;
}


function startPrototypeMusic(){
  if(music.isPlaying) music.stop();
  music.setBuffer(makePrototypeMusic());
  music.setLoop(true);
  music.setVolume(.95);
  loaded=true;

    [196.00,246.94,293.66,392.00],
    [233.08,293.66,349.23,466.16],
    [207.65,261.63,311.13,415.30]
  ];
  const pattern=[0,3,2,3,1,3,2,1];
  const total=chords.length*pattern.length*step;
  const buf=ctx.createBuffer(1,Math.floor(total*sr),sr);
  const data=buf.getChannelData(0);
  function add(freq,start,dur,amp){
    const a=Math.floor(start*sr),b=Math.min(data.length,Math.floor((start+dur)*sr));
    for(let i=a;i<b;i++){
      const t=(i-a)/sr,env=Math.min(1,t/.01)*Math.exp(-3.6*t/dur),ph=2*Math.PI*freq*t;
      data[i]+=amp*env*(Math.sin(ph)+.21*Math.sin(ph*2)+.06*Math.sin(ph*3));
    }
  }
  let n=0;
  for(let c=0;c<chords.length;c++)for(let s=0;s<pattern.length;s++,n++){
    const start=n*step;add(chords[c][pattern[s]],start,step*.88,.16);
    if(s===0)add(chords[c][0]/2,start,step*2.5,.08);
  }
  let peak=.001;for(let i=0;i<data.length;i++)peak=Math.max(peak,Math.abs(data[i]));
  const gain=.72/peak;for(let i=0;i<data.length;i++)data[i]*=gain;
  return buf;
}

function makeAutumnMusic(){
  const ctx=listener.context,sr=ctx.sampleRate,step=.24;
  const chords=[
    [261.63,329.63,392.00,523.25],
    [293.66,369.99,440.00,587.33],
    [220.00,277.18,329.63,440.00],
    [246.94,311.13,369.99,493.88]
  ];
  const pattern=[0,1,2,3,2,1,3,2];
  const total=chords.length*pattern.length*step;
  const buf=ctx.createBuffer(1,Math.floor(total*sr),sr);
  const data=buf.getChannelData(0);
  function add(freq,start,dur,amp){
    const a=Math.floor(start*sr),b=Math.min(data.length,Math.floor((start+dur)*sr));
    for(let i=a;i<b;i++){
      const t=(i-a)/sr,env=Math.min(1,t/.014)*Math.exp(-2.9*t/dur),ph=2*Math.PI*freq*t;
      data[i]+=amp*env*(Math.sin(ph)+.18*Math.sin(ph*2));
    }
  }
  let n=0;
  for(let c=0;c<chords.length;c++)for(let s=0;s<pattern.length;s++,n++){
    const start=n*step;add(chords[c][pattern[s]],start,step*.9,.16);
    if(s===0||s===4)add(chords[c][0]/2,start,step*1.6,.07);
  }
  let peak=.001;for(let i=0;i<data.length;i++)peak=Math.max(peak,Math.abs(data[i]));
  const gain=.72/peak;for(let i=0;i<data.length;i++)data[i]*=gain;
  return buf;
}

  startPrototypeMusic();

  // If a real winter.mp3 exists, swap it in when it finishes loading.
  new THREE.AudioLoader().load(
    "winter.mp3",
    b=>{
      if(music.isPlaying) music.stop();
      music.setBuffer(b);
      music.setLoop(true);
      music.setVolume(1);
      loaded=true;
      usingPrototype=false;
      if(listener.context.state==="suspended") listener.context.resume().catch(()=>{});
      music.play();

function updateBoat(dt,t){
  if(!started||transitioning||(gameComplete&&!festivalMode))return;

  if(!boating){
    const boatAtDock=Math.hypot(gondola.position.x-boatHome.x,gondola.position.z-boatHome.z)<.9;
    const playerNear=Math.hypot(camera.position.x-8.9,camera.position.z-8.0)<2.0;
    if(boatAtDock&&playerNear&&performance.now()>boatCooldown)boardBoat();
    return;
  }

  let steer=mobile?mx:((keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0));
  let throttle=mobile?-my:((keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0));
  if(Math.abs(steer)<.04)steer=0;
  if(Math.abs(throttle)<.04)throttle=0;

  boatYaw-=steer*1.18*dt*(.45+.55*Math.abs(throttle));
  // Keep the boat broadly aligned with the canal so it remains easy to drive.
  boatYaw=THREE.MathUtils.clamp(boatYaw,-2.42,-.72);

  boatForward.set(Math.cos(boatYaw),0,-Math.sin(boatYaw));
  const speed=3.0;
  let nx=gondola.position.x+boatForward.x*throttle*speed*dt;
  let nz=gondola.position.z+boatForward.z*throttle*speed*dt;

  // Northern stretch of canal: enough room for a real ride without clipping the bridge.
  nx=THREE.MathUtils.clamp(nx,-2.75,6.72);
  nz=THREE.MathUtils.clamp(nz,5.65,27.2);
  gondola.position.x=nx;
  gondola.position.z=nz;
  gondola.rotation.y=boatYaw;
  gondola.position.y=.13+Math.sin(t*2.1)*.025;
  oar.rotation.z=-.08+Math.sin(t*4.0)*.08*Math.abs(throttle);

  if(Math.hypot(gondola.position.x-boatHome.x,gondola.position.z-boatHome.z)>3.2)boatHasLeftDock=true;

  const behindX=-boatForward.x*.72,behindZ=-boatForward.z*.72;
  camera.position.set(gondola.position.x+behindX,1.52,gondola.position.z+behindZ);

  if(boatHasLeftDock&&Math.hypot(gondola.position.x-boatHome.x,gondola.position.z-boatHome.z)<1.65){
    dockAndExit();
  }
}

function collide(x,z){
  if(inShop){
    if(x<76.45||x>83.55||z<-1.02||z>4.45)return true;
    return false;
  }
  if(x<-C.bound||x>C.bound||z<-C.bound||z>C.bound)return true;for(const o of obs)if(x+rad>o.x1&&x-rad<o.x2&&z+rad>o.z1&&z-rad<o.z2)return true;return false}
function move(dt){if(boating){moveAmount=0;return}if(!started||(!mobile&&document.pointerLockElement!==renderer.domElement)){moveAmount=0;return}let x=mobile?mx:((keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)),z=mobile?my:((keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0));if(Math.abs(x)<.02&&Math.abs(z)<.02){moveAmount+=(0-moveAmount)*Math.min(1,dt*8);camera.position.y=1.7+Math.sin(walkPhase)*.018*moveAmount;return}const n=Math.hypot(x,z);if(n>1){x/=n;z/=n}moveAmount+=(Math.min(1,n)-moveAmount)*Math.min(1,dt*10);walkPhase+=dt*8.2*Math.max(.25,moveAmount);fwd.set(-Math.sin(yaw),0,-Math.cos(yaw));right.set(Math.cos(yaw),0,-Math.sin(yaw));const dx=(right.x*x+fwd.x*-z)*C.speed*dt,dz=(right.z*x+fwd.z*-z)*C.speed*dt;if(!collide(camera.position.x+dx,camera.position.z))camera.position.x+=dx;if(!collide(camera.position.x,camera.position.z+dz))camera.position.z+=dz;camera.position.y=1.7+Math.sin(walkPhase)*.025*moveAmount}
