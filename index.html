const coinPositions=seasonCoinPositions.winter;

const factPool=[

];
const usedFacts=new Set();
let factTimer=null;

function randomFact(){
  if(usedFacts.size>=factPool.length)usedFacts.clear();
  const choices=[];
  for(let i=0;i<factPool.length;i++)if(!usedFacts.has(i))choices.push(i);
  const pick=choices[Math.floor(Math.random()*choices.length)];
  usedFacts.add(pick);
  return factPool[pick];
}

function showFact(){
  factText.textContent=randomFact();
  factCard.classList.remove("show");
  requestAnimationFrame(()=>factCard.classList.add("show"));
  clearTimeout(factTimer);
  factTimer=setTimeout(()=>factCard.classList.remove("show"),3600);
}

function coinChime(){
  const ctx=listener.context;
  const now=ctx.currentTime;
  [880,1174.66].forEach((freq,j)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,now);
    g.gain.exponentialRampToValueAtTime(.09,now+.01+j*.025);
    g.gain.exponentialRampToValueAtTime(.0001,now+.28+j*.05);
    o.connect(g).connect(ctx.destination);
    o.start(now+j*.04);o.stop(now+.38+j*.05);
  });
}

function resetCoins(season){
  collected=0;
  coinCount.textContent="0";
  const positions=seasonCoinPositions[season];
  for(let i=0;i<coins.length;i++){
    const coin=coins[i],p=positions[i];
    coin.position.set(...p);
    coin.userData.baseY=p[1];
    coin.userData.collected=false;
    coin.visible=true;
  }
}

function collectCoin(coin){
  if(coin.userData.collected)return;
  coin.userData.collected=true;
  coin.visible=false;
  collected++;
  coinCount.textContent=collected;
  coinChime();
  showFact();

  if(collected===coins.length){
    if(world==="autumn"){
      collectFlash.textContent="The Four Seasons Complete";
      collectFlash.classList.add("show");
      setTimeout(()=>collectFlash.classList.remove("show"),3200);
      found.querySelector(".n").textContent="Antonio Vivaldi";
      found.querySelector(".w").textContent="The Four Seasons";
      found.querySelector(".s").textContent="Venice — 1725";
      found.classList.add("show");
      setTimeout(()=>found.classList.remove("show"),6200);
      return;
    }

    collectFlash.textContent="Portal Open";
    collectFlash.classList.add("show");
    setTimeout(()=>collectFlash.classList.remove("show"),1200);
    setTimeout(()=>{
      info.innerHTML="RETURN TO THE ARCH";
      info.classList.add("show");
      setTimeout(()=>info.classList.remove("show"),2600);
    },900);
    activatePortal();
  }else{
    collectFlash.textContent="+1 Zecchino";
    collectFlash.classList.add("show");
    setTimeout(()=>collectFlash.classList.remove("show"),650);
  }
}

function makePrototypeMusic(){
  const ctx=listener.context,sr=ctx.sampleRate,step=.29;
  const chords=[
    [293.66,349.23,440.00,587.33],
    [233.08,293.66,349.23,466.16],
    [261.63,329.63,392.00,523.25],
    [220.00,277.18,329.63,440.00]
  ];
  const pattern=[0,1,2,3,2,1,2,3];
  const total=chords.length*pattern.length*step;
  const buf=ctx.createBuffer(1,Math.floor(total*sr),sr);
  const data=buf.getChannelData(0);

  function addTone(freq,start,dur,amp){
    const a=Math.floor(start*sr),b=Math.min(data.length,Math.floor((start+dur)*sr));
    for(let i=a;i<b;i++){
      const t=(i-a)/sr;
      const attack=Math.min(1,t/.018);
      const decay=Math.exp(-3.1*t/dur);
      const env=attack*decay;
      const ph=2*Math.PI*freq*t;
      data[i]+=amp*env*(Math.sin(ph)+.22*Math.sin(ph*2)+.08*Math.sin(ph*3));
    }
  }

  let n=0;
  for(let c=0;c<chords.length;c++){
    const chord=chords[c];
    for(let s=0;s<pattern.length;s++,n++){
      const start=n*step;
      addTone(chord[pattern[s]],start,step*.92,.17);
      if(s===0||s===4) addTone(chord[0]/2,start,step*1.8,.11);
    }
  }

  let peak=.001;
  for(let i=0;i<data.length;i++) peak=Math.max(peak,Math.abs(data[i]));
  const gain=.72/peak;
  for(let i=0;i<data.length;i++) data[i]*=gain;
  return buf;
}

  music.setVolume(.95);

      child.position.y+=Math.sin(t*1.5+child.userData.phase)*.0008;
      child.material.opacity=.55+.35*Math.sin(t*2.1+child.userData.phase);
      child.material.transparent=true;
    }
  }
}
for(const coin of coins){
  if(coin.userData.collected)continue;
  coin.rotation.y=t*1.5+coin.userData.phase;
  coin.position.y=coin.userData.baseY+Math.sin(t*2.1+coin.userData.phase)*.12;
  if(camera.position.distanceTo(coin.position)<1.15) collectCoin(coin);
}
mood(t);violin.rotation.y=Math.sin(t*.5)*.03;renderer.render(scene,camera)}
animate();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
</script>
</body>
