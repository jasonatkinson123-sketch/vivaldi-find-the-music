<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Vivaldi: Find the Music</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#f2f2ef;font-family:Helvetica,Arial,sans-serif;touch-action:none}canvas{display:block}
#veil,#info,#found,#pause,#touch{position:fixed;inset:0}#veil{z-index:20;display:grid;place-items:center;background:#000;transition:opacity 1.1s;pointer-events:auto}#veil.hide{opacity:0;pointer-events:none}
.title{text-align:center;text-transform:uppercase;letter-spacing:.28em}.title h1{margin:0;font-weight:200;font-size:clamp(32px,7vw,68px);letter-spacing:.34em;transform:translateX(.17em)}.title h2{margin:13px 0 38px;font-size:clamp(14px,2.5vw,23px);font-weight:300;color:#aaa;letter-spacing:.42em;transform:translateX(.21em)}
button{appearance:none;background:transparent;border:1px solid #444;color:#eee;padding:14px 22px;font:12px Helvetica,Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase;pointer-events:auto}
#info{z-index:12;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7vh;opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;font-size:11px;line-height:1.8;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 1px 8px #000}#info.show{opacity:1}
#found{z-index:11;display:grid;place-items:center;opacity:0;transition:opacity 1.2s;pointer-events:none;text-align:center;text-transform:uppercase;text-shadow:0 3px 24px #000}#found.show{opacity:1}#found .n{font-size:14px;color:#bbb;letter-spacing:.27em}#found .w{font-size:clamp(34px,8vw,76px);font-weight:200;letter-spacing:.34em;transform:translateX(.17em);margin:8px 0}#found .s{font-size:12px;color:#bbb;letter-spacing:.18em}
#pause{z-index:14;display:none;place-items:center;background:#0009;backdrop-filter:blur(4px)}#pause.show{display:grid}
#touch{z-index:10;display:none;pointer-events:none}body.mobile #touch{display:block}body.mobile #pause{display:none!important}
.zone{position:absolute;top:0;bottom:0;width:50%;pointer-events:auto;touch-action:none}.left{left:0}.right{right:0}
#base{position:absolute;width:92px;height:92px;border:1px solid #ffffff2b;border-radius:50%;opacity:0;transform:translate(-50%,-50%);pointer-events:none}#knob{position:absolute;left:50%;top:50%;width:34px;height:34px;border:1px solid #ffffff55;border-radius:50%;background:#ffffff0d;transform:translate(-50%,-50%)}
#hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#ffffff66;font-size:9px;letter-spacing:.16em;text-transform:uppercase;pointer-events:none}
#vig{position:fixed;inset:0;z-index:6;pointer-events:none;background:radial-gradient(circle at center,transparent 42%,#0002 68%,#000b 125%)}
</style>
</head>
<body>
<div id="veil"><div class="title"><h1>Vivaldi</h1><h2>Find the Music</h2><button id="enter">Click to Enter</button></div></div>
<div id="info">WASD — MOVE<br>MOUSE — LOOK</div>
<div id="pause"><button id="resume">Return to Venice</button></div>
<div id="found"><div><div class="n">Antonio Vivaldi</div><div class="w">Winter</div><div class="s">The Four Seasons — 1725</div></div></div>
<div id="touch"><div id="moveZone" class="zone left"></div><div id="lookZone" class="zone right"></div><div id="base"><div id="knob"></div></div><div id="hint">LEFT — MOVE &nbsp;&nbsp; RIGHT — LOOK</div></div>
<div id="vig"></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";

const C={speed:4.4,bound:31,fogNear:9,fogFar:49,snow:850,snowSpeed:2.5,source:new THREE.Vector3(20,1.2,-20),radius:3.3};
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x050914); scene.fog=new THREE.Fog(0x050914,C.fogNear,C.fogFar);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,120); camera.position.set(-23,1.7,22); camera.rotation.order="YXZ";
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; document.body.prepend(renderer.domElement);

const veil=document.querySelector("#veil"),enter=document.querySelector("#enter"),info=document.querySelector("#info"),pause=document.querySelector("#pause"),resume=document.querySelector("#resume"),found=document.querySelector("#found"),moveZone=document.querySelector("#moveZone"),lookZone=document.querySelector("#lookZone"),base=document.querySelector("#base"),knob=document.querySelector("#knob");
const mobile=matchMedia("(pointer:coarse)").matches||("ontouchstart"in window); if(mobile){document.body.classList.add("mobile");enter.textContent="Tap to Enter"}
let started=false,done=false,yaw=0,pitch=-.03,mx=0,my=0,moveId=null,lookId=null,ox=0,oy=0,lx=0,ly=0;

scene.add(new THREE.HemisphereLight(0x7183a6,0x121015,1.05));
const moonLight=new THREE.DirectionalLight(0xa9c5ff,1.55); moonLight.position.set(-18,28,12); scene.add(moonLight);
const moon=new THREE.Mesh(new THREE.SphereGeometry(2.3,16,10),new THREE.MeshBasicMaterial({color:0xd7e3ff})); moon.position.set(-24,23,-35); scene.add(moon);

const M={
 snow:new THREE.MeshStandardMaterial({color:0xcdd8e4,roughness:1}),
 stone:new THREE.MeshStandardMaterial({color:0x434853,roughness:1}),
 dark:new THREE.MeshStandardMaterial({color:0x272b34,roughness:1}),
 a:new THREE.MeshStandardMaterial({color:0x6d665f,roughness:1}),
 b:new THREE.MeshStandardMaterial({color:0x5b6267,roughness:1}),
 c:new THREE.MeshStandardMaterial({color:0x665c61,roughness:1}),
 roof:new THREE.MeshStandardMaterial({color:0x292a30,roughness:1}),
 ice:new THREE.MeshStandardMaterial({color:0x567080,roughness:.28,metalness:.12,transparent:true,opacity:.88,emissive:0x0b1720,emissiveIntensity:.12})
};
const obs=[];
const lamps=[];
function box(w,h,d,m,x,y,z){const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x,y,z);scene.add(q);return q}
function block(x,z,w,d,h,m){box(w,h,d,m,x,h/2,z);const r=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.66,1.7,4),M.roof);r.position.set(x,h+.72,z);r.rotation.y=Math.PI/4;scene.add(r);obs.push({x1:x-w/2-.35,x2:x+w/2+.35,z1:z-d/2-.35,z2:z+d/2+.35});const wm=new THREE.MeshBasicMaterial({color:0xdba46d,transparent:true,opacity:.35});for(let i=0,n=Math.max(1,Math.floor(w/4));i<n;i++){const p=new THREE.Mesh(new THREE.PlaneGeometry(.7,1.05),wm);p.position.set(x-w*.32+(i/Math.max(1,n-1))*w*.64,Math.min(3.2,h*.55),z+d/2+.01);scene.add(p)}}
function lamp(x,z){box(.12,2.7,.12,M.dark,x,1.35,z);const b=new THREE.Mesh(new THREE.SphereGeometry(.15,8,6),new THREE.MeshBasicMaterial({color:0xffcf8a}));b.position.set(x,2.72,z);scene.add(b);const l=new THREE.PointLight(0xffa85c,1.05,8.5,2.2);l.position.set(x,2.65,z);scene.add(l);lamps.push({light:l,bulb:b,phase:Math.random()*10})}

const ground=new THREE.Mesh(new THREE.PlaneGeometry(74,74),new THREE.MeshStandardMaterial({color:0x161b24,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.04;scene.add(ground);
box(26,.12,19,M.stone,-15,.01,15);box(8,.11,50,M.stone,-16,.02,-5);box(9,.11,50,M.stone,19,.02,-5);box(36,.11,7,M.stone,2,.02,-24);
box(25.6,.035,2.2,M.snow,-15,.095,10.8);box(7.5,.035,14,M.snow,-16,.095,-1);box(8.5,.035,13,M.snow,19,.095,5);
box(10.8,.08,61,M.ice,2,.01,-1.5);box(.45,.75,61,M.dark,-3.55,.33,-1.5);box(.45,.75,61,M.dark,7.55,.33,-1.5);
obs.push({x1:-3.5,x2:7.5,z1:-31,z2:-.5},{x1:-3.5,x2:7.5,z1:4.6,z2:29});
box(11.4,.28,4.8,M.stone,2,.55,2.05);box(1.1,.5,4.8,M.dark,-3.2,.62,2.05);box(1.1,.5,4.8,M.dark,7.2,.62,2.05);

// A frozen low-poly gondola silhouette: just enough Venice to register.
const gondola=new THREE.Group();
const hull=new THREE.Mesh(new THREE.BoxGeometry(4.6,.28,.9),new THREE.MeshStandardMaterial({color:0x111216,roughness:.9}));
hull.rotation.y=.16;gondola.add(hull);
const bow=new THREE.Mesh(new THREE.ConeGeometry(.34,1.25,5),new THREE.MeshStandardMaterial({color:0x111216,roughness:.9}));
bow.rotation.z=Math.PI/2;bow.rotation.y=-.16;bow.position.set(2.45,.18,.39);gondola.add(bow);
const stern=bow.clone();stern.rotation.z=-Math.PI/2;stern.position.set(-2.45,.18,-.39);gondola.add(stern);
const seat=new THREE.Mesh(new THREE.BoxGeometry(1.2,.18,.65),M.dark);seat.position.y=.24;gondola.add(seat);
gondola.position.set(2,.13,12);gondola.rotation.y=-.12;scene.add(gondola);

block(-27,13,9,13,7.5,M.a);block(-27,-3,9,13,10,M.b);block(-27,-20,9,13,8.4,M.c);block(-10,-10,8.5,13,8.8,M.a);block(-10,-24,8.5,11,7.3,M.b);block(14,16,7,10,8.4,M.c);block(26,13,8,13,10,M.a);block(27,-4,8,14,8.2,M.b);block(27,-22,8,13,9.6,M.c);block(13,-29,10,6,7.8,M.a);
lamp(-20,14);lamp(-12,4);lamp(-13,-14);lamp(14,8);lamp(17,-9);

const shrine=new THREE.Group(); shrine.position.copy(C.source);scene.add(shrine);
const baseStone=new THREE.Mesh(new THREE.CylinderGeometry(1.55,1.8,.42,8),M.dark);baseStone.position.y=.18;shrine.add(baseStone);
for(const x of[-1.3,1.3]){const p=new THREE.Mesh(new THREE.BoxGeometry(.4,3.3,.4),M.dark);p.position.set(x,1.8,0);shrine.add(p)}
const top=new THREE.Mesh(new THREE.BoxGeometry(3,.4,.4),M.dark);top.position.set(0,3.35,0);shrine.add(top);
const vm=new THREE.MeshStandardMaterial({color:0x8b4024,roughness:.62,emissive:0x4a1708,emissiveIntensity:.4}),violin=new THREE.Group();
const lo=new THREE.Mesh(new THREE.SphereGeometry(.46,12,8),vm);lo.scale.set(.88,1.18,.38);lo.position.y=1.02;violin.add(lo);
const up=new THREE.Mesh(new THREE.SphereGeometry(.36,12,8),vm);up.scale.set(.82,1.02,.34);up.position.y=1.62;violin.add(up);
const neck=new THREE.Mesh(new THREE.BoxGeometry(.13,1.15,.1),vm);neck.position.y=2.25;violin.add(neck);
const scroll=new THREE.Mesh(new THREE.SphereGeometry(.15,8,6),vm);scroll.position.y=2.9;violin.add(scroll);violin.rotation.z=-.12;violin.position.y=.28;shrine.add(violin);
const orb=new THREE.Mesh(new THREE.SphereGeometry(.28,10,8),new THREE.MeshBasicMaterial({color:0xffb36b,transparent:true,opacity:.82}));orb.position.set(0,2.4,-.15);shrine.add(orb);
const warm=new THREE.PointLight(0xff8f4d,2.1,13,1.6);warm.position.set(0,2.2,.4);shrine.add(warm);

const sp=new Float32Array(C.snow*3),ss=new Float32Array(C.snow);for(let i=0;i<C.snow;i++){sp[i*3]=THREE.MathUtils.randFloatSpread(65);sp[i*3+1]=THREE.MathUtils.randFloat(.5,24);sp[i*3+2]=THREE.MathUtils.randFloatSpread(65);ss[i]=THREE.MathUtils.randFloat(.55,1.25)}
const sg=new THREE.BufferGeometry();sg.setAttribute("position",new THREE.BufferAttribute(sp,3));const flakes=new THREE.Points(sg,new THREE.PointsMaterial({color:0xe8f1ff,size:.09,transparent:true,opacity:.72,depthWrite:false}));scene.add(flakes);

const listener=new THREE.AudioListener();camera.add(listener);const music=new THREE.PositionalAudio(listener);shrine.add(music);music.setRefDistance(2);music.setMaxDistance(90);music.setRolloffFactor(1);music.setDistanceModel("linear");music.setLoop(true);music.setVolume(1);
const low=listener.context.createBiquadFilter();low.type="lowpass";low.frequency.value=1100;low.Q.value=.6;music.setFilter(low);let loaded=false,requested=false,usingPrototype=false;

function makePrototypeMusic(){
  const ctx=listener.context,sr=ctx.sampleRate,step=.29;
  const chords=[
    [293.66,349.23,440.00,587.33],
    [233.08,293.66,349.23,466.16],
    [261.63,329.63,392.00,523.25],
    [220.00,277.18,329.63,440.00]
  ];
  const pattern=[0,1,2,3,2,1,2,3];
  const total=chords.length*pattern.length*step;
  const buf=ctx.createBuffer(1,Math.floor(total*sr),sr);
  const data=buf.getChannelData(0);

  function addTone(freq,start,dur,amp){
    const a=Math.floor(start*sr),b=Math.min(data.length,Math.floor((start+dur)*sr));
    for(let i=a;i<b;i++){
      const t=(i-a)/sr;
      const attack=Math.min(1,t/.018);
      const decay=Math.exp(-3.1*t/dur);
      const env=attack*decay;
      const ph=2*Math.PI*freq*t;
      data[i]+=amp*env*(Math.sin(ph)+.22*Math.sin(ph*2)+.08*Math.sin(ph*3));
    }
  }

  let n=0;
  for(let c=0;c<chords.length;c++){
    const chord=chords[c];
    for(let s=0;s<pattern.length;s++,n++){
      const start=n*step;
      addTone(chord[pattern[s]],start,step*.92,.17);
      if(s===0||s===4) addTone(chord[0]/2,start,step*1.8,.11);
    }
  }

  let peak=.001;
  for(let i=0;i<data.length;i++) peak=Math.max(peak,Math.abs(data[i]));
  const gain=.72/peak;
  for(let i=0;i<data.length;i++) data[i]*=gain;
  return buf;
}

function startPrototypeMusic(){
  if(music.isPlaying) music.stop();
  music.setBuffer(makePrototypeMusic());
  music.setLoop(true);
  music.setVolume(.95);
  loaded=true;
  usingPrototype=true;
  music.play();
  console.info("Using built-in prototype music. Add winter.mp3 later for the real recording.");
}

function audio(){
  if(requested){if(loaded&&!music.isPlaying)music.play();return}
  requested=true;

  // Start audible prototype music immediately inside the tap/click gesture.
  // This is important on iPhone/Safari, which is stricter about audio startup.
  startPrototypeMusic();

  // If a real winter.mp3 exists, swap it in when it finishes loading.
  new THREE.AudioLoader().load(
    "winter.mp3",
    b=>{
      if(music.isPlaying) music.stop();
      music.setBuffer(b);
      music.setLoop(true);
      music.setVolume(1);
      loaded=true;
      usingPrototype=false;
      if(listener.context.state==="suspended") listener.context.resume().catch(()=>{});
      music.play();
    },
    undefined,
    ()=>console.info("winter.mp3 not present; continuing with built-in prototype music")
  );
}

const keys={},rad=.38,fwd=new THREE.Vector3(),right=new THREE.Vector3();let walkPhase=0,moveAmount=0;
function lock(){renderer.domElement.requestPointerLock?.()}
function begin(){started=true;veil.classList.add("hide");listener.context.resume().then(()=>audio()).catch(()=>audio());if(!mobile)lock();info.innerHTML=mobile?"SOUND ON<br>LEFT — MOVE · RIGHT — LOOK":"SOUND ON<br>WASD — MOVE · MOUSE — LOOK";info.classList.add("show");setTimeout(()=>info.classList.remove("show"),3600)}
enter.onclick=begin;resume.onclick=()=>{listener.context.resume().catch(()=>{});if(!mobile)lock()};
document.addEventListener("pointerlockchange",()=>{if(started&&!mobile)pause.classList.toggle("show",document.pointerLockElement!==renderer.domElement)});
document.addEventListener("mousemove",e=>{if(document.pointerLockElement!==renderer.domElement)return;yaw-=e.movementX*.0019;pitch=THREE.MathUtils.clamp(pitch-e.movementY*.0019,-1.1,1.05);camera.rotation.set(pitch,yaw,0)});
addEventListener("keydown",e=>keys[e.code]=true);addEventListener("keyup",e=>keys[e.code]=false);

function stick(x,y){base.style.left=ox+"px";base.style.top=oy+"px";base.style.opacity=1;knob.style.transform=`translate(calc(-50% + ${x*30}px),calc(-50% + ${y*30}px))`}
moveZone.addEventListener("touchstart",e=>{if(!started||moveId!==null)return;const t=e.changedTouches[0];moveId=t.identifier;ox=t.clientX;oy=t.clientY;mx=my=0;stick(0,0);e.preventDefault()},{passive:false});
moveZone.addEventListener("touchmove",e=>{for(const t of e.changedTouches){if(t.identifier!==moveId)continue;let dx=t.clientX-ox,dy=t.clientY-oy,d=Math.hypot(dx,dy)||1,s=Math.min(1,46/d);mx=dx*s/46;my=dy*s/46;stick(mx,my)}e.preventDefault()},{passive:false});
function endMove(){moveId=null;mx=my=0;base.style.opacity=0;knob.style.transform="translate(-50%,-50%)"}moveZone.addEventListener("touchend",e=>{for(const t of e.changedTouches)if(t.identifier===moveId)endMove();e.preventDefault()},{passive:false});moveZone.addEventListener("touchcancel",endMove);
lookZone.addEventListener("touchstart",e=>{if(!started||lookId!==null)return;const t=e.changedTouches[0];lookId=t.identifier;lx=t.clientX;ly=t.clientY;e.preventDefault()},{passive:false});
lookZone.addEventListener("touchmove",e=>{for(const t of e.changedTouches){if(t.identifier!==lookId)continue;const dx=t.clientX-lx,dy=t.clientY-ly;lx=t.clientX;ly=t.clientY;yaw-=dx*.0052;pitch=THREE.MathUtils.clamp(pitch-dy*.0052,-1.1,1.05);camera.rotation.set(pitch,yaw,0)}e.preventDefault()},{passive:false});
lookZone.addEventListener("touchend",e=>{for(const t of e.changedTouches)if(t.identifier===lookId)lookId=null;e.preventDefault()},{passive:false});lookZone.addEventListener("touchcancel",()=>lookId=null);

function collide(x,z){if(x<-C.bound||x>C.bound||z<-C.bound||z>C.bound)return true;for(const o of obs)if(x+rad>o.x1&&x-rad<o.x2&&z+rad>o.z1&&z-rad<o.z2)return true;return false}
function move(dt){if(!started||(!mobile&&document.pointerLockElement!==renderer.domElement)){moveAmount=0;return}let x=mobile?mx:((keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)),z=mobile?my:((keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0));if(Math.abs(x)<.02&&Math.abs(z)<.02){moveAmount+=(0-moveAmount)*Math.min(1,dt*8);camera.position.y=1.7+Math.sin(walkPhase)*.018*moveAmount;return}const n=Math.hypot(x,z);if(n>1){x/=n;z/=n}moveAmount+=(Math.min(1,n)-moveAmount)*Math.min(1,dt*10);walkPhase+=dt*8.2*Math.max(.25,moveAmount);fwd.set(-Math.sin(yaw),0,-Math.cos(yaw));right.set(Math.cos(yaw),0,-Math.sin(yaw));const dx=(right.x*x+fwd.x*-z)*C.speed*dt,dz=(right.z*x+fwd.z*-z)*C.speed*dt;if(!collide(camera.position.x+dx,camera.position.z))camera.position.x+=dx;if(!collide(camera.position.x,camera.position.z+dz))camera.position.z+=dz;camera.position.y=1.7+Math.sin(walkPhase)*.025*moveAmount}

let foundAt=0;
function mood(t){const d=camera.position.distanceTo(C.source),near=THREE.MathUtils.clamp(1-d/42,0,1);if(loaded)low.frequency.setTargetAtTime(done?16000:THREE.MathUtils.lerp(650,12000,near*near),listener.context.currentTime,.12);warm.intensity=done?4.6+Math.sin(t*2.2)*.5:1.25+near*2.1;orb.scale.setScalar(done?1.45+Math.sin(t*2.6)*.1:.85+near*.7);if(!done&&d<C.radius){done=true;foundAt=t;found.classList.add("show");M.ice.emissive.setHex(0x24424d);M.ice.emissiveIntensity=.55;if(loaded){music.setRefDistance(14);music.setRolloffFactor(.55);music.setVolume(1)}setTimeout(()=>found.classList.remove("show"),6200)}if(done&&t-foundAt<5)scene.fog.color.lerp(new THREE.Color(0x101423),.01)}

const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;move(dt);
const gust=.72+.28*(.5+.5*Math.sin(t*.19));
const p=flakes.geometry.attributes.position.array,b=(done?1.75:1)*gust;
for(let i=0;i<C.snow;i++){const k=i*3;p[k+1]-=C.snowSpeed*ss[i]*dt*b;p[k]+=Math.sin(t*.7+i*.31)*.018*b+p[k+1]*0;p[k+2]+=Math.cos(t*.43+i*.19)*.009*b;if(p[k+1]<.15){p[k+1]=THREE.MathUtils.randFloat(17,25);p[k]=THREE.MathUtils.randFloatSpread(65);p[k+2]=THREE.MathUtils.randFloatSpread(65)}}
flakes.geometry.attributes.position.needsUpdate=true;
for(let i=0;i<lamps.length;i++){const q=lamps[i],f=.94+.06*Math.sin(t*3.1+q.phase)+.025*Math.sin(t*7.7+q.phase*.7);q.light.intensity=1.05*f;q.bulb.material.opacity=.86+.08*f}
if(!done)M.ice.emissiveIntensity=.11+.035*Math.sin(t*.55);
mood(t);violin.rotation.y=Math.sin(t*.5)*.03;renderer.render(scene,camera)}
animate();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
</script>
</body>
</html>
